<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- UTT Bridge & Transport icon -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="url(#utt_grad)" />
    <!-- Bridge curves / Transport motif -->
    <path d="M12 44 C22 20, 42 20, 52 44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M18 44 C26 30, 38 30, 46 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M22 28 L22 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M32 24 L32 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M42 28 L42 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="45" x2="56" y2="45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stylized star / crest -->
    <circle cx="32" cy="17" r="3" fill="#ffffff" />
  </g>
  <!-- Text: ĐẠI HỌC CÔNG NGHỆ GIAO THÔNG VẬN TẢI -->
  <text x="82" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#a11f24" letter-spacing="0.5">TRƯỜNG ĐẠI HỌC</text>
  <text x="82" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#ea580c" letter-spacing="0.3">CÔNG NGHỆ GTVT</text>
  <text x="82" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">E-GOV PORTAL • UTT</text>
  <defs>
    <linearGradient id="utt_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ea580c" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
  </defs>
</svg>
